<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raffle Draw</title>
<style>
:root{--ink:#f2f5ef;--muted:#9aa39a;--accent:#b7f34b;--accent-dark:#d9ff7a;--accent-soft:#20261a;--line:#262b23;--bg:#0c0e0b;--card:#161a13;--amber:#e8a33d;--amber-soft:#241c10;--amber-line:#4a3a1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{text-align:center;margin-bottom:20px}
.brand{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
h1{font-size:30px;font-weight:800;margin-top:4px;word-break:break-word}
.sub{color:var(--muted);font-size:15px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.45)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;color:var(--ink);background:#0f120d;outline:none}
input:focus{border-color:var(--accent)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:700}
.btn{padding:12px 18px;font-size:15px}
.btn-accent{background:var(--accent);color:#0c0e0b}
.btn-accent:hover{background:#a8e63e}
.btn-ghost{background:var(--accent-soft);color:var(--accent)}
.btn-big{width:100%;padding:16px;font-size:19px;border-radius:16px;background:var(--accent);color:#0c0e0b}
.btn-big:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;font-size:15px;background:#12150f;border:1.5px solid var(--line);color:var(--muted);border-radius:12px;font-weight:700}
.tab-on{background:var(--accent-soft);color:var(--accent);border-color:#3a4a24}
.counter{display:inline-flex;background:var(--accent);color:#0c0e0b;font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px;margin:12px 0 10px}
.counter.warn{background:var(--amber);color:#1a1105}
.going{font-size:15px;color:var(--accent);font-weight:700;margin-bottom:12px}
.fullbox{border:1.5px dashed var(--amber-line);background:var(--amber-soft);border-radius:16px;padding:18px;text-align:center}
.fullbox h3{color:var(--amber);font-size:17px;margin-bottom:4px}
.fullbox p{color:#cdb98f;font-size:14px}
.names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.namechip{background:#20261a;border:1.5px solid var(--line);border-radius:999px;padding:7px 10px 7px 14px;font-size:14px;font-weight:600;color:#e6ebdf;display:inline-flex;align-items:center;gap:8px}
.chipx{background:none;border:none;color:var(--muted);font-size:18px;font-weight:800;line-height:1;padding:0 2px;cursor:pointer;border-radius:50%}
.chipx:hover{color:var(--accent)}
.results-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.results-grid{grid-template-columns:1fr 1fr}}
.teamcard{border:1.5px solid #2c3524;border-radius:16px;padding:16px;background:#1c2218}
.teamcard h3{font-size:17px;font-weight:800;color:var(--accent);margin-bottom:8px}
.teamcard ol{padding-left:22px;font-size:15px;line-height:1.7;color:#e6ebdf}
.afterbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.afterbar button{flex:1;min-width:130px}
.drawstage{text-align:center;padding:24px 10px;display:none}
.drawstage .rolling{font-size:26px;font-weight:800;color:var(--accent);min-height:38px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#0c0e0b;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.linkrow{display:flex;gap:8px;margin-top:8px}
.linkrow input{flex:1;font-size:13px;color:#aab3a6}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">Raffle Draw</div></header>
<div id="app"><div class="card" style="text-align:center"><h1 style="font-size:22px">Loading&hellip;</h1></div></div>
<footer>Names stay with the organizer. Refresh-proof, no account needed.</footer>
</div>
<div id="toast"></div>
<script>
const API = "https://xifoneivzxmdcjowpxbz.supabase.co/functions/v1/raffle";
const QS = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;

function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var toastTimer=null;
function toast(m){var t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show")},2600)}
function copyText(t,fallbackMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Copied")},function(){fallback(t,fallbackMsg)})}
  else{fallback(t,fallbackMsg)}
}
function fallback(t,m){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast(m||"Copied")}catch(e){toast("Copy failed")}document.body.removeChild(a)}
function resultsText(s){
  var lines=[(s.event_name||"Team Raffle")+" - raffle teams"];
  (s.results||[]).forEach(function(team,i){lines.push("");lines.push("Team "+(i+1)+" ("+team.length+")");team.forEach(function(n,j){lines.push((j+1)+". "+n)})});
  return lines.join("\n");
}
function teamCard(i,team){
  var d=document.createElement("div");d.className="teamcard";
  var h=document.createElement("h3");h.textContent="Team "+(i+1)+" ("+team.length+")";
  var ol=document.createElement("ol");team.forEach(function(n){var li=document.createElement("li");li.textContent=n;ol.appendChild(li)});
  d.appendChild(h);d.appendChild(ol);return d;
}
function renderResults(s,gridId){
  var g=el(gridId);g.innerHTML="";
  (s.results||[]).forEach(function(team,i){g.appendChild(teamCard(i,team))});
}
function roundRect(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
function downloadImage(s){
  var teams=s.results||[];if(!teams.length){toast("Draw first");return}
  var per=0;teams.forEach(function(t){per=Math.max(per,t.length)});
  var W=1080,pad=60,cardW=W-pad*2;
  var headH=250,cardH=90+per*46,gap=28,footH=90;
  var H=headH+teams.length*(cardH+gap)+footH;
  var c=document.createElement("canvas");c.width=W;c.height=Math.min(H,4000);
  var x=c.getContext("2d");
  x.fillStyle="#0c0e0b";x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#b7f34b";x.font="700 26px -apple-system,Segoe UI,Roboto,Arial";x.textAlign="center";
  x.fillText("R A F F L E   T E A M S",W/2,86);
  var name=(s.event_name||"Team Raffle");
  x.fillStyle="#f2f5ef";x.font="800 58px -apple-system,Segoe UI,Roboto,Arial";
  if(name.length>26){name=name.slice(0,25)+"…"}
  x.fillText(name,W/2,150);
  x.fillStyle="#9aa39a";x.font="600 28px -apple-system,Segoe UI,Roboto,Arial";
  x.fillText(teams.length+" teams · "+s.count+" participants",W/2,200);
  var y=headH;
  teams.forEach(function(team,i){
    x.fillStyle="#161a13";
    roundRect(x,pad,y,cardW,cardH,24);x.fill();
    x.strokeStyle="#2c3524";x.lineWidth=2;roundRect(x,pad,y,cardW,cardH,24);x.stroke();
    x.fillStyle="#16a34a";x.beginPath();x.arc(pad+46,y+46,22,0,Math.PI*2);x.fill();
    x.fillStyle="#0c0e0b";x.font="800 24px -apple-system,Segoe UI,Roboto,Arial";x.textAlign="center";x.fillText(String(i+1),pad+46,y+55);
    x.fillStyle="#b7f34b";x.font="800 30px -apple-system,Segoe UI,Roboto,Arial";x.textAlign="left";
    x.fillText("Team "+(i+1),pad+86,y+57);
    x.fillStyle="#e6ebdf";x.font="600 28px -apple-system,Segoe UI,Roboto,Arial";
    team.forEach(function(n,j){
      var nm=n.length>34?n.slice(0,33)+"…":n;
      x.fillText((j+1)+".  "+nm,pad+50,y+120+j*46);
    });
    y+=cardH+gap;
  });
  x.fillStyle="#6b7a6e";x.font="600 22px -apple-system,Segoe UI,Roboto,Arial";x.textAlign="center";
  x.fillText("Drawn at random · good luck to every team",W/2,c.height-40);
  c.toBlob(function(b){
    var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=(s.event_name||"raffle").toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-teams.png";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},3000);
    toast("Team card image downloaded. Send it to the group.");
  },"image/png");
}
async function getState(id){
  var r=await fetch(API+"?action=state&r="+encodeURIComponent(id));
  return r.json();
}
function notFound(msg){
  el("app").innerHTML='<div class="card" style="text-align:center"><h1 style="font-size:22px">Not found</h1><div class="sub">'+esc(msg||"This raffle link is not valid.")+'</div><div style="margin-top:14px"><button class="btn btn-accent" onclick="location.href=\''+BASE+'?p=create\'">Start a new raffle</button></div></div>';
}

/* ---------- MY RAFFLES (saved on this device) ---------- */
function getMine(){try{return JSON.parse(localStorage.getItem("rd_mine")||"[]")}catch(e){return[]}}
function saveMine(id,key,name,teams,per){try{var l=getMine().filter(function(m){return m.id!==id});l.unshift({id:id,key:key,name:name,teams:teams,per:per,ts:Date.now()});localStorage.setItem("rd_mine",JSON.stringify(l))}catch(e){}}
function removeMine(id){try{localStorage.setItem("rd_mine",JSON.stringify(getMine().filter(function(m){return m.id!==id})))}catch(e){}}
function tabbar(active){
  return '<div class="tabs"><button class="tab'+(active==="create"?" tab-on":"")+'" onclick="location.href=\''+BASE+'?p=create\'">Create</button><button class="tab'+(active==="mine"?" tab-on":"")+'" onclick="location.href=\''+BASE+'?p=mine\'">My raffles</button></div>';
}
/* ---------- MY RAFFLES PAGE ---------- */
function myRafflesPage(){
  document.title="My raffles - Raffle Draw";
  var l=getMine();
  var parts=[tabbar("mine")];
  if(!l.length){
    parts.push('<div class="card" style="text-align:center"><h1 style="font-size:22px">No raffles here yet</h1><div class="sub">Every raffle you create on this device is saved here, so a closed tab never costs you your dashboard. Raffles made on another device stay on that device.</div></div>');
  }else{
    l.forEach(function(m){
      var ds="";try{ds=new Date(m.ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})}catch(e){}
      parts.push('<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div style="min-width:0"><h3 style="font-size:18px;font-weight:800;word-break:break-word">'+esc(m.name||"Raffle")+'</h3><div class="sub" style="font-size:13px;margin-top:4px">'+m.teams+" teams · "+m.per+" per team"+(ds?" · "+ds:"")+'</div></div><button class="btn btn-ghost" data-rm style="padding:6px 10px;font-size:12px">Remove</button></div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-accent" data-open>Open dashboard</button><button class="btn btn-ghost" data-pl>Copy participant link</button></div></div>');
    });
  }
  el("app").innerHTML=parts.join("");
  l.forEach(function(m){
    document.querySelectorAll(".card").forEach(function(row){
      if(row.getAttribute("data-bound"))return;
      var nm=row.querySelector("h3");if(!nm||nm.textContent!==(m.name||"Raffle"))return;
      row.setAttribute("data-bound","1");
      var ob=row.querySelector("[data-open]"),pb=row.querySelector("[data-pl]"),rb=row.querySelector("[data-rm]");
      if(ob)ob.onclick=function(){location.href=BASE+"?o="+m.id+"&k="+m.key};
      if(pb)pb.onclick=function(){copyText(BASE+"?r="+m.id,"Participant link copied. Send it to the group.")};
      if(rb)rb.onclick=function(){removeMine(m.id);myRafflesPage()};
    });
  });
}

/* ---------- CREATE PAGE ---------- */
function createPage(){
  el("app").innerHTML=tabbar("create")+
  '<div class="card">'+
    '<h1 style="font-size:24px">Create a raffle</h1>'+
    '<div class="sub" style="margin-bottom:16px">Set the shape. The link you share closes itself when it is full.</div>'+
    '<div style="margin-bottom:12px"><label for="eventName">Event name</label><input type="text" id="eventName" placeholder="e.g. Sunday Youth Challenge" maxlength="60"></div>'+
    '<div style="display:flex;gap:12px;margin-bottom:16px">'+
      '<div style="flex:1"><label for="teams">Number of teams</label><input type="number" id="teams" min="2" max="12" value="3"></div>'+
      '<div style="flex:1"><label for="perTeam">People per team</label><input type="number" id="perTeam" min="1" max="50" value="3"></div>'+
    '</div>'+
    '<button class="btn-big" id="createBtn">Create the raffle</button>'+
  '</div>'+
  '<div class="card" id="doneCard" style="display:none">'+
    '<h1 style="font-size:24px">Your raffle is live</h1>'+
    '<div class="sub" style="margin-bottom:10px">Send the participant link to the group. People register themselves until the slots fill.</div>'+
    '<div class="sub" style="margin-bottom:10px">Saved to My raffles on this device, so you can always come back.</div>'+
    '<label>Participant link (send this to the group)</label>'+
    '<div class="linkrow"><input type="text" id="pLink" readonly><button class="btn btn-accent" id="copyP">Copy</button></div>'+
    '<div style="margin-top:14px"><label>Your organizer dashboard (keep this)</label>'+
    '<div class="linkrow"><input type="text" id="oLink" readonly><button class="btn btn-ghost" id="copyO">Copy</button></div></div>'+
    '<div style="margin-top:16px"><button class="btn-big" id="goDash">Open my dashboard</button></div>'+
  '</div>';
  document.title="Create a raffle - Raffle Draw";
  el("createBtn").onclick=async function(){
    var name=el("eventName").value.trim();
    var teams=parseInt(el("teams").value,10)||3;
    var per=parseInt(el("perTeam").value,10)||3;
    if(!name){toast("Give the event a name first");return}
    if(teams<2)teams=2;if(per<1)per=1;
    el("createBtn").disabled=true;el("createBtn").textContent="Creating...";
    try{
      var r=await fetch(API+"?action=create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event_name:name,teams:teams,per_team:per})});
      var d=await r.json();
      if(d.error){toast(d.error);el("createBtn").disabled=false;el("createBtn").textContent="Create the raffle";return}
      var p=BASE+"?r="+d.id, o=BASE+"?o="+d.id+"&k="+d.key;
      saveMine(d.id,d.key,name,teams,per);
      el("pLink").value=p;el("oLink").value=o;
      el("copyP").onclick=function(){copyText(p,"Participant link copied. Send it to the group.")};
      el("copyO").onclick=function(){copyText(o,"Dashboard link copied")};
      el("goDash").onclick=function(){location.href=o};
      el("doneCard").style.display="block";el("doneCard").scrollIntoView({behavior:"smooth"});
    }catch(e){toast("Could not reach the server. Check your connection.")}
    el("createBtn").disabled=false;el("createBtn").textContent="Create the raffle";
  };
}

/* ---------- PARTICIPANT PAGE ---------- */
function participantPage(id){
  el("app").innerHTML=
  '<h1 id="event">Loading…</h1>'+
  '<div class="sub">Add your name to the raffle. Everyone gets a team when the organizer draws.</div>'+
  '<div style="text-align:center"><div class="counter" id="counter"><span id="countNum">0</span>&nbsp;of&nbsp;<span id="capNum">0</span>&nbsp;registered</div></div>'+
  '<div class="going" style="text-align:center" id="going"></div>'+
  '<div class="card" id="joinArea">'+
    '<label for="nameInput">Your name</label>'+
    '<div style="display:flex;gap:10px"><input type="text" id="nameInput" maxlength="40" autocomplete="off" placeholder="Type your name"><button class="btn btn-accent" id="joinBtn">Join</button></div>'+
    '<div id="joinedMsg" style="display:none;color:var(--accent-dark);font-weight:700;font-size:15px;margin-top:10px"></div>'+
  '</div>'+
  '<div class="fullbox" id="fullMsg" style="display:none">'+
    '<h3>Slots have been filled</h3>'+
    '<p>No more space for participants. Watch this space: the draw is coming.</p>'+
  '</div>'+
  '<div class="fullbox" id="doneMsg" style="display:none">'+
    '<h3>The teams have been drawn</h3>'+
    '<p><a id="resLink" style="color:var(--accent-dark);font-weight:800" href="#">See which team you are in</a></p>'+
  '</div>'+
  '<div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:10px">Registered so far</h3><div class="names" id="namesList"></div></div>';
  var R=id;
  var joined=null;try{joined=localStorage.getItem("rd_"+R)}catch(e){}
  async function poll(){
    var s;try{s=await getState(R)}catch(e){return}
    if(s.error){notFound("This raffle link is not valid or has been removed.");return}
    el("event").textContent=s.event_name;document.title=s.event_name+" - Raffle Draw";
    el("countNum").textContent=s.count;el("capNum").textContent=s.capacity;
    var left=s.capacity-s.count;
    el("going").textContent=left>0?(left+" more participant"+(left===1?"":"s")+" to go"):"";
    var full=s.count>=s.capacity;
    el("counter").classList.toggle("warn",full);
    var nl=el("namesList");nl.innerHTML="";
    s.names.forEach(function(n){var c=document.createElement("span");c.className="namechip";c.textContent=n;nl.appendChild(c)});
    if(!s.names.length){nl.innerHTML='<span style="color:var(--muted);font-style:italic;font-size:14px">No names yet. Be the first.</span>'}
    if(s.drawn){el("doneMsg").style.display="block";el("joinArea").style.display="none";el("fullMsg").style.display="none";el("resLink").href=BASE+"?r="+R+"&v=results";return}
    if(full){el("fullMsg").style.display="block";el("joinArea").style.display="none"}
    else{el("fullMsg").style.display="none";el("joinArea").style.display="block"}
    if(joined&&!s.names.some(function(x){return x.toLowerCase()===String(joined).toLowerCase()})){joined=null;try{localStorage.removeItem("rd_"+R)}catch(e){}}
    if(joined){el("joinedMsg").style.display="block";el("joinedMsg").textContent="You are in as "+joined+".";el("nameInput").style.display="none";el("joinBtn").style.display="none"}
    else{el("joinedMsg").style.display="none";el("nameInput").style.display="";el("joinBtn").style.display=""}
  }
  el("joinBtn").onclick=async function(){
    var n=el("nameInput").value.trim();if(!n){toast("Type your name first");return}
    try{
      var r=await fetch(API+"?action=register&r="+encodeURIComponent(R),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n})});
      var d=await r.json();
      if(d.error==="filled"){toast("Slots have been filled")}
      else if(d.error==="duplicate"){toast("That name is already on the list")}
      else if(d.error){toast(d.error)}
      else{try{localStorage.setItem("rd_"+R,n)}catch(e){}joined=n;el("nameInput").value="";el("nameInput").blur()}
    }catch(e){toast("Could not reach the server. Check your connection.")}
    poll();
  };
  el("nameInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();el("joinBtn").click()}});
  poll();setInterval(poll,4000);
}

/* ---------- ORGANIZER PAGE ---------- */
function organizerPage(id,key){
  el("app").innerHTML=
  '<h1 id="event">Loading…</h1>'+
  '<div class="sub" id="shape"></div>'+
  '<div style="text-align:center"><div class="counter" id="counter"><span id="countNum">0</span>&nbsp;of&nbsp;<span id="capNum">0</span>&nbsp;registered</div></div>'+
  '<div class="going" style="text-align:center" id="going"></div>'+
  '<div class="card">'+
    '<h3 style="font-size:15px;font-weight:800;margin-bottom:6px">Participant link</h3>'+
    '<div class="sub" style="margin-bottom:8px;font-size:13px">Send this to the group. It closes itself when the slots fill.</div>'+
    '<div class="linkrow"><input type="text" id="pLink" readonly><button class="btn btn-accent" id="copyP">Copy</button></div>'+
    '<div style="margin-top:10px"><div class="linkrow"><input type="text" id="oLink" readonly><button class="btn btn-ghost" id="copyO">Copy</button></div>'+
    '<div class="sub" style="font-size:12px;margin-top:4px">Second box: your dashboard link. Keep it to come back here.</div></div>'+
  '</div>'+
  '<div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:10px">Registered (<span id="cnt2">0</span>)</h3><div class="names" id="namesList" style="justify-content:flex-start"></div></div>'+
  '<div class="card" id="drawCard">'+
    '<button class="btn-big" id="drawBtn">Draw the teams</button>'+
    '<div class="drawstage" id="drawStage"><div class="rolling" id="rollName">Shuffling…</div></div>'+
    '<div id="resWrap" style="display:none">'+
      '<h3 style="font-size:16px;font-weight:800;margin:14px 0 10px">The teams</h3>'+
      '<div class="results-grid" id="resGrid"></div>'+
      '<div class="afterbar">'+
        '<button class="btn btn-accent" id="imgBtn">Download team image</button>'+
        '<button class="btn btn-ghost" id="copyRes">Copy results</button>'+
        '<button class="btn btn-ghost" id="againBtn">Shuffle again</button>'+
      '</div>'+
      '<div class="sub" style="margin-top:12px;text-align:center">Announce it: share the results link below, then the image.<div class="linkrow"><input type="text" id="rLink" readonly><button class="btn btn-accent" id="copyR">Copy</button></div></div>'+
    '</div>'+
  '</div>';
  var R=id,K=key,LAST=null,SAVED=false;
  el("pLink").value=BASE+"?r="+R;
  el("oLink").value=location.href;
  el("copyP").onclick=function(){copyText(el("pLink").value,"Participant link copied. Send it to the group.")};
  el("copyO").onclick=function(){copyText(el("oLink").value,"Dashboard link copied")};
  async function removeName(n){
    if(!confirm("Remove "+n+" from the list?"))return;
    try{
      var r=await fetch(API+"?action=remove&r="+encodeURIComponent(R),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:K,name:n})});
      var d=await r.json();
      if(d.error){toast(d.error);return}
      toast(n+" removed from the list");
      poll();
    }catch(e){toast("Could not reach the server. Check your connection.")}
  }
  async function poll(){
    var s;try{s=await getState(R)}catch(e){return}
    if(s.error){notFound("This dashboard link is not valid.");return}
    LAST=s;
    if(!SAVED){saveMine(R,K,s.event_name,s.teams,s.per_team);SAVED=true}
    el("event").textContent=s.event_name;document.title=s.event_name+" - Organizer";
    el("shape").textContent=s.teams+" teams · "+s.per_team+" per team · capacity "+s.capacity;
    el("countNum").textContent=s.count;el("capNum").textContent=s.capacity;el("cnt2").textContent=s.count;
    var left=s.capacity-s.count,full=s.count>=s.capacity;
    el("going").textContent=full?"Full. Ready to draw.":(left+" more participant"+(left===1?"":"s")+" to go");
    el("counter").classList.toggle("warn",full);
    var nl=el("namesList");nl.innerHTML="";
    s.names.forEach(function(n){
      var c=document.createElement("span");c.className="namechip";c.textContent=n;
      if(!s.drawn){var b=document.createElement("button");b.className="chipx";b.setAttribute("aria-label","Remove "+n);b.textContent="\u00d7";b.onclick=function(){removeName(n)};c.appendChild(b)}
      nl.appendChild(c);
    });
    if(s.drawn&&s.results){el("resWrap").style.display="block";renderResults(s,"resGrid");el("rLink").value=BASE+"?r="+R+"&v=results";el("copyR").onclick=function(){copyText(el("rLink").value,"Results link copied")}}
  }
  el("drawBtn").onclick=async function(){
    if(!LAST||LAST.count<2){toast("Need at least 2 participants");return}
    var b=el("drawBtn");b.disabled=true;b.textContent="Shuffling…";
    el("drawStage").style.display="block";
    var names=LAST.names,ticks=0;
    var t=setInterval(function(){
      el("rollName").textContent=names[Math.floor(Math.random()*names.length)];ticks++;
      if(ticks>22){clearInterval(t);el("rollName").textContent="Done!";
        setTimeout(async function(){
          try{
            var r=await fetch(API+"?action=draw&r="+encodeURIComponent(R),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:K})});
            var d=await r.json();
            if(d.error){toast(d.error)}else{
              LAST.results=d.results;LAST.drawn=true;
              el("resWrap").style.display="block";renderResults(LAST,"resGrid");
              el("rLink").value=BASE+"?r="+R+"&v=results";
              el("copyR").onclick=function(){copyText(el("rLink").value,"Results link copied")};
              el("resWrap").scrollIntoView({behavior:"smooth"});
            }
          }catch(e){toast("Could not reach the server. Try again.")}
          el("drawStage").style.display="none";b.disabled=false;b.textContent="Draw the teams";
        },400);
      }
    },100);
  };
  el("imgBtn").onclick=function(){downloadImage(LAST)};
  el("copyRes").onclick=function(){copyText(resultsText(LAST),"Results copied. Paste away.")};
  el("againBtn").onclick=async function(){
    try{
      var r=await fetch(API+"?action=draw&r="+encodeURIComponent(R),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:K})});
      var d=await r.json();
      if(d.error){toast(d.error);return}
      LAST.results=d.results;renderResults(LAST,"resGrid");toast("Shuffled into fresh teams");
    }catch(e){toast("Could not reach the server. Try again.")}
  };
  poll();setInterval(poll,4000);
}

/* ---------- RESULTS PAGE ---------- */
function resultsPage(id){
  el("app").innerHTML=
  '<h1 id="event">Loading…</h1>'+
  '<div class="sub">Drawn at random. Good luck to every team.</div>'+
  '<div class="card"><div class="results-grid" id="resGrid"></div>'+
  '<div class="afterbar">'+
    '<button class="btn btn-accent" id="imgBtn">Download team image</button>'+
    '<button class="btn btn-ghost" id="copyRes">Copy results</button>'+
  '</div></div>';
  var R=id,LAST=null;
  async function poll(){
    var s;try{s=await getState(R)}catch(e){return}
    if(s.error){notFound("This raffle link is not valid.");return}
    LAST=s;
    el("event").textContent=s.event_name;document.title=s.event_name+" - Teams";
    if(s.drawn&&s.results){renderResults(s,"resGrid")}
    else{notFound("The teams have not been drawn for this raffle yet.");}
  }
  el("imgBtn").onclick=function(){downloadImage(LAST)};
  el("copyRes").onclick=function(){copyText(resultsText(LAST),"Results copied. Paste away.")};
  poll();
}

/* ---------- ROUTER ---------- */
(function(){
  var r=QS.get("r"), o=QS.get("o"), k=QS.get("k"), p=QS.get("p");
  if(p==="mine"){myRafflesPage()}
  else if(o&&k){organizerPage(o,k)}
  else if(r&&QS.get("v")==="results"){resultsPage(r)}
  else if(r){participantPage(r)}
  else{createPage()}
})();
</script>
